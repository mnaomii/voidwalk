<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Voidwalk icon: a spectral ghost carrying a lantern whose light reveals a line of code in the void">
  <defs>
